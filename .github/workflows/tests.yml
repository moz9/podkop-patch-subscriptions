name: Offline candidate checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sandbox and verification prerequisites
        run: sudo apt-get update && sudo apt-get install -y bubblewrap util-linux python3 jq shellcheck
      - name: Run offline, read-only candidate checks
        run: sh scripts/verify-candidate-ci.sh
